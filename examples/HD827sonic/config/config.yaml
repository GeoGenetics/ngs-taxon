
#############
### ALIGN ###
#############
taxdump: "data/taxdump/"

ref:
  test:
    n_shards: 2
    path: "data/test.{n_shard}-of-2.fas.gz"
    map:
      tool: bowtie2
      params: "-k 10 -L 22 -i S,1,1.15 --mp 1,1 --rdg 0,1 --rfg 0,1 --score-min L,0,-0.1 --no-unal"
      bt2l: False
    acc2taxid: "data/test.acc2taxid.gz"
    lengths: "data/test.lengths.tsv"

filter:
  saturated_reads:
    activate: true
    n_alns: 10

unicorn:
  refstats:
    params: "--minrefl 1 --minreads 1 --rank genus"
  taxstats:
    params: "-k 17 --minrefl  1 --minreads 1 --minmani 0 --minalnas -Inf --maxdust 100"

metadmg:
  damage:
    params: "--print_length 15"

  lca:
    params: "--fix_ncbi 0 --how_many 15 --sim_score_low 0.95 --weight_type 0 --lca_rank genus"

  dfit:
    params: "--nopt 5 --showfits 2 --seed 12345"

mlid:
  abundance:
    params: "--truncate-fraction 0.1"
  lca:
    params: "--mass-absolute 0.1 --mass-relative 0.1"

report:
  multiqc: "--verbose"
