[workspace]
channels = ["conda-forge", "bioconda", "nodefaults"]
name = "ngs-taxon"
platforms = ["linux-64"]
version = "0.12.0"

[tasks]

[dependencies]
snakemake = ">=9.0.1,<10"
conda = ">=25.1.1,<27"

[environments]
test = { features = ["test"] }
format = { features = ["format"], no-default-feature = true }

[feature.test.dependencies]
pytest = ">=9.0.2"
graphviz = ">=12.2.1"
picard-slim = ">=3.4.0,<4"

[feature.format.dependencies]
ruff = ">=0.15.1"
snakefmt = ">=0.11.5"
